<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Uriel Website Dashboard</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar (logo, save state, Publish) → tabs → list or editor. Plain, large tap targets, works on a phone. */
:root{
  --paper:#efeeec;--sheet:#fbfbfa;--ink:#262628;--muted:#6b6a6e;--rule:rgba(38,38,40,.14);
  --orange:#fe6404;--orange-ink:#c44c00;--ok:#2f7d4a;--bad:#b3261e;
  --c-p:#fe6404;--c-c:#d99a00;--c-g:#1f5f8b;--c-f:#3c7a3a;--c-v:#6b4fa0;
  --display:"Gloock",Georgia,serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--paper:#1d1d1f;--sheet:#28282b;--ink:#ededee;--muted:#a4a3a8;--rule:rgba(237,237,238,.16);--orange-ink:#ff8a3d;--ok:#6fc28c;--bad:#ff8a80;--c-c:#f2c230;--c-g:#5fa3d6;--c-f:#6fb36a;--c-v:#a58be0;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:920px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1}
p{margin:0}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn{border:1px solid var(--ink);background:transparent;padding:11px 16px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.solid:disabled{background:var(--muted);border-color:var(--muted);cursor:default;opacity:.6}
.btn.quiet{border-color:var(--rule)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 11px;font-size:11px}
label.f{display:grid;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);padding:11px 12px;border-radius:0;width:100%}
label.f textarea{min-height:110px;resize:vertical;line-height:1.45}
label.f .hint{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:13.5px}
.check{display:flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--orange)}

/* Top bar */
.top{position:sticky;top:0;z-index:10;background:var(--sheet);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top .in{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.top img{width:34px;height:auto}
.top .ttl{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.top .ttl b{font-family:var(--display);font-weight:400;font-size:20px}
.state{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.state.dirty{color:var(--orange-ink)}.state.dirty::before{background:var(--orange)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);background:var(--sheet)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:14px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

main{padding-block:24px 80px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{color:var(--muted);max-width:56ch;margin-top:6px}
.list{display:grid;gap:10px}
.item{background:var(--sheet);border:1px solid var(--rule);display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px}
.item .th{width:88px;height:66px;background:var(--paper);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .nm{font-family:var(--display);font-size:20px;line-height:1.15}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:4px;font-size:14px;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.item{grid-template-columns:72px minmax(0,1fr)}.item .th{width:72px;height:56px}.item .acts{grid-column:1/-1;justify-content:flex-start}}
.co{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.co i{width:9px;height:9px;display:inline-block}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;padding:3px 6px}
.st.build{color:var(--orange-ink)}.st.done{color:var(--ok)}.st.design{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--rule);background:transparent;padding:8px 11px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.empty{border:1px dashed var(--muted);padding:24px;color:var(--muted);text-align:center}

/* Editor */
.editor{background:var(--sheet);border:1px solid var(--ink);padding:clamp(16px,3vw,26px);display:grid;gap:16px}
.editor .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:620px){.editor .row{grid-template-columns:minmax(0,1fr)}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:4/3;background:var(--paper);overflow:hidden;border:1px solid var(--rule)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cover{position:absolute;left:6px;top:6px;background:var(--orange);color:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px}
.ph .pa{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.ph .pa button{background:rgba(20,20,22,.8);color:#fff;border:0;width:34px;height:34px;cursor:pointer;font-size:15px}
.ph.up{display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.addph{border:1px dashed var(--muted);aspect-ratio:4/3;display:grid;place-items:center;cursor:pointer;color:var(--muted);text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px}
.addph:hover{border-color:var(--ink);color:var(--ink)}
.addph input{position:absolute;width:1px;height:1px;opacity:0}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--rule);padding-top:16px}
.grid2{display:grid;gap:12px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.utotal{font-family:var(--display);font-size:20px}
.urows{display:grid;gap:8px;margin-bottom:10px}
.urow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.8fr) auto;gap:10px;align-items:end;background:var(--paper);padding:10px;border:1px solid var(--rule)}
@media (max-width:520px){.urow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.urow label:first-child{grid-column:1/-1}}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--sheet);border:1px solid var(--ink);padding:28px;width:min(100%,420px);display:grid;gap:16px}
.card img{width:46px}
.err{color:var(--bad);font-size:15px;min-height:1.4em}
.setup{background:var(--sheet);border:1px solid var(--bad);padding:16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:12px 18px;font-size:15px;z-index:50;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
</style>
</head>
<body>

<!-- Login -->
<section class="login" id="loginView" hidden>
  <form class="card" id="loginForm">
    <img src="/favicon.png" alt="Uriel">
    <div><h1>Website dashboard</h1><p class="mono" style="margin-top:6px">Uriel · urielngr.pages.dev</p></div>
    <div class="setup" id="setupMsg" hidden></div>
    <label class="f" for="pw">Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn solid" type="submit">Log in</button>
    <p class="err" id="loginErr" aria-live="polite"></p>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="top gut">
    <div class="in">
      <img src="/favicon.png" alt="">
      <div class="ttl"><b>Website dashboard</b><span class="state" id="state">All changes published</span></div>
      <a class="btn quiet sm" href="/" target="_blank" rel="noopener">View site ↗</a>
      <button class="btn solid" id="publish" type="button" disabled>Publish changes</button>
      <button class="btn quiet sm" id="logout" type="button">Log out</button>
    </div>
  </header>
  <nav class="tabs gut" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="now" aria-selected="true">Now at Uriel</button>
    <button role="tab" data-tab="projects" aria-selected="false">Projects</button>
    <button role="tab" data-tab="contact" aria-selected="false">Contact details</button>
    <button role="tab" data-tab="text" aria-selected="false">Page text</button>
  </nav>
  <main class="gut"><div class="in" id="view"></div></main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COMP={p:'Uriel Properties',c:'Uriel Construction',g:'Uriel Oil and Gas',f:'Uriel Farms',v:'Uriel Integrated Ventures'};
const STATUS={build:'Under construction / ongoing',design:'In design',done:'Completed'};
const UTYPES={detached:'Detached house',semi:'Semi-detached house',terrace:'Terrace house',townhouse:'Town house',maisonette:'Maisonette',flat:'Flat / apartment',penthouse:'Penthouse',plot:'Plot',other:'Other unit'};
const CATS={road:'Roads',school:'Schools',health:'Healthcare',civic:'Public buildings',comm:'Commercial'};
const TEXT={properties:'Uriel Properties',construction:'Uriel Construction',oilgas:'Uriel Oil and Gas',farms:'Uriel Farms',ventures:'Uriel Integrated Ventures'};
const src=u=>!u?'':/^(https?:|\/)/.test(u)?u:'/'+u;
let doc=null,dirty=false,tab='now',editing=null,projFilter='all';

function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800);}
function setDirty(v){dirty=v;$('#publish').disabled=!v;const s=$('#state');s.classList.toggle('dirty',v);s.textContent=v?'Unpublished changes':'All changes published';}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

/* ---------- Start ---------- */
async function start(){
  let info={};try{info=await (await fetch('/api/login',{cache:'no-store'})).json();}catch(e){}
  if(info.authed) return openApp();
  $('#loginView').hidden=false;
  if(info.setup){$('#setupMsg').hidden=false;$('#setupMsg').textContent=info.setup;}
  $('#pw').focus();
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#loginErr').textContent='';
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#loginErr').textContent=j.error||'Could not log in. Try again.';return;}
  $('#loginView').hidden=true;openApp();
});
$('#logout').onclick=async()=>{if(dirty&&!confirmInline($('#logout'),'Discard changes?'))return;await fetch('/api/login',{method:'DELETE'});dirty=false;location.reload();};

async function openApp(){
  let r=await fetch('/api/content',{cache:'no-store'});
  if(!r.ok) r=await fetch('/content-default.json',{cache:'no-store'});
  doc=await r.json();
  doc.now=doc.now||[];doc.projects=doc.projects||[];doc.contact=doc.contact||{};doc.text=doc.text||{};
  $('#app').hidden=false;render();
}

/* Two-tap confirm instead of browser dialogs */
function confirmInline(btn,label){if(btn.dataset.arm==='1'){btn.dataset.arm='';return true;}const old=btn.textContent;btn.dataset.arm='1';btn.textContent=label;setTimeout(()=>{if(btn.dataset.arm==='1'){btn.dataset.arm='';btn.textContent=old;}},3000);return false;}

/* ---------- Publish ---------- */
$('#publish').onclick=async()=>{
  const b=$('#publish');b.disabled=true;b.textContent='Publishing…';
  try{
    const r=await fetch('/api/content',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(doc)});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){toast('Your login has expired. Log in again, then publish.',true);setTimeout(()=>location.reload(),1500);return;}
    if(!r.ok) throw new Error(j.error||'Could not publish.');
    setDirty(false);toast('Published. The website now shows your changes.');
  }catch(e){toast(e.message+' Your changes are still here; try again.',true);b.disabled=false;}
  finally{b.textContent='Publish changes';}
};

/* ---------- Tabs ---------- */
$$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=null;render();scrollTo(0,0);});
function render(){
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const v=$('#view');
  if(editing) return renderEditor(v);
  ({now:renderNow,projects:renderProjects,contact:renderContact,text:renderText})[tab](v);
}
const coTag=k=>`<span class="co"><i style="background:var(--c-${k})"></i>${esc(COMP[k]||'')}</span>`;
const thumb=ph=>`<div class="th">${ph&&ph[0]?`<img src="${esc(src(ph[0]))}" alt="" loading="lazy">`:'No photo'}</div>`;

/* ---------- Now at Uriel ---------- */
function renderNow(v){
  v.innerHTML=`<div class="head"><div><h2>Now at Uriel</h2><p>The slideshow on the home page. It moves to the next item every 5 seconds. The first photo of each item is the one shown.</p></div><button class="btn solid" id="addNow">+ Add update</button></div>
  <div class="list">${doc.now.map((n,i)=>`<div class="item">${thumb(n.photos)}<div><div class="nm">${esc(n.title)||'<i>Untitled</i>'}</div><div class="meta">${coTag(n.company)}<span class="st ${n.status}">${STATUS[n.status]||''}</span><span>${(n.photos||[]).length} photos</span></div></div>
   <div class="acts"><button class="btn sm quiet" data-up="${i}" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="btn sm quiet" data-down="${i}" ${i<doc.now.length-1?'':'disabled'} aria-label="Move down">↓</button><button class="btn sm" data-edit="${i}">Edit</button><button class="btn sm danger" data-del="${i}">Remove</button></div></div>`).join('')||'<div class="empty">No updates yet. Add one to show it on the home page.</div>'}</div>`;
  $('#addNow').onclick=()=>{doc.now.push({company:'p',title:'',text:'',location:'',status:'build',photos:[]});editing={kind:'now',i:doc.now.length-1,isNew:true};render();};
  wireList(v,doc.now,'now');
}
/* ---------- Projects ---------- */
function renderProjects(v){
  const L=doc.projects.map((p,i)=>[p,i]).filter(([p])=>projFilter==='all'||p.company===projFilter);
  v.innerHTML=`<div class="head"><div><h2>Projects</h2><p>Every project shown on the company pages. Projects without photos appear in the "photos coming" list.</p></div><button class="btn solid" id="addProj">+ Add project</button></div>
  <div class="chips">${[['all','All'],...Object.entries(COMP).map(([k,n])=>[k,n.replace('Uriel ','')])].map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${projFilter===k}">${esc(n)} (${k==='all'?doc.projects.length:doc.projects.filter(p=>p.company===k).length})</button>`).join('')}</div>
  <div class="list">${L.map(([p,i])=>`<div class="item">${thumb(p.photos)}<div><div class="nm">${esc(p.name)||'<i>Untitled</i>'}</div><div class="meta">${coTag(p.company)}<span class="st ${p.status}">${STATUS[p.status]||''}</span><span>${esc(p.location)}</span>${(p.units||[]).length?`<span>· ${(p.units||[]).reduce((a,u)=>a+(+u.count||0),0)} units</span>`:''}${p.home?'<span>· On home page</span>':''}</div></div>
   <div class="acts"><button class="btn sm" data-edit="${i}">Edit</button><button class="btn sm danger" data-del="${i}">Remove</button></div></div>`).join('')||'<div class="empty">No projects for this company yet.</div>'}</div>`;
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{projFilter=b.dataset.f;render();});
  $('#addProj').onclick=()=>{doc.projects.unshift({id:'p'+Date.now().toString(36),company:projFilter==='all'?'p':projFilter,name:'',location:'',status:'build',year:'',description:'',photos:[]});editing={kind:'project',i:0,isNew:true};render();};
  wireList(v,doc.projects,'project');
}
function wireList(v,arr,kind){
  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing={kind,i:+b.dataset.edit};render();scrollTo(0,0);});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirmInline(b,'Tap to confirm'))return;arr.splice(+b.dataset.del,1);setDirty(true);render();toast('Removed. Publish to update the website.');});
  v.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[arr[i-1],arr[i]]=[arr[i],arr[i-1]];setDirty(true);render();});
  v.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[arr[i+1],arr[i]]=[arr[i],arr[i+1]];setDirty(true);render();});
}

/* ---------- Editor (update or project) ---------- */
function renderEditor(v){
  const isNow=editing.kind==='now',arr=isNow?doc.now:doc.projects,it=arr[editing.i];
  const opt=(o,sel)=>Object.entries(o).map(([k,n])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(n)}</option>`).join('');
  v.innerHTML=`<div class="head"><div><span class="mono">${isNow?'Now at Uriel':'Project'}</span><h2>${editing.isNew?(isNow?'New update':'New project'):'Edit '+(esc(isNow?it.title:it.name)||'item')}</h2></div><button class="btn quiet" id="back">← Back to list</button></div>
  <form class="editor" id="ed" novalidate>
    ${isNow?`<label class="f" for="e-from">Start from a project (optional)<select id="e-from"><option value="">Choose a project to copy its details and photos</option>${doc.projects.map((p,i)=>`<option value="${i}">${esc(p.name)} · ${esc(COMP[p.company])}</option>`).join('')}</select></label>`:''}
    <div class="row">
      <label class="f" for="e-co">Company<select id="e-co">${opt(COMP,it.company)}</select></label>
      <label class="f" for="e-st">Status<select id="e-st">${opt(STATUS,it.status)}</select></label>
    </div>
    <label class="f" for="e-name">${isNow?'Title':'Project name'}<input id="e-name" value="${esc(isNow?it.title:it.name)}" placeholder="${isNow?'e.g. Bogije road and drainage':'e.g. 22 Bourdillon'}"></label>
    <div class="row">
      <label class="f" for="e-loc">Location<input id="e-loc" value="${esc(it.location)}" placeholder="e.g. Banana Island, Ikoyi"></label>
      ${isNow?'<span></span>':`<label class="f" for="e-yr">Year or label<input id="e-yr" value="${esc(it.year)}" placeholder="e.g. 2023, or leave blank"></label>`}
    </div>
    <label class="f" for="e-txt">${isNow?'What is happening (one or two sentences)':'Description'}<textarea id="e-txt" placeholder="${isNow?'e.g. The structure is up. Cladding and glazing are going in.':'e.g. 8 three-bedroom flats and 2 maisonettes.'}">${esc(isNow?it.text:it.description)}</textarea></label>
    ${isNow?'':`<div class="row"><label class="f" for="e-cat" ${it.company==='c'?'':'hidden'} id="catWrap">Type of work<select id="e-cat"><option value="">None</option>${opt(CATS,it.category)}</select></label>
      <label class="check" for="e-home"><input type="checkbox" id="e-home" ${it.home?'checked':''}> Show on the home page (up to 6)</label></div>`}
    ${isNow?'':`<div class="grid2"><div class="uhead"><span class="mono">Units</span><span class="utotal" id="utot"></span></div><div id="units"></div>
      <label class="f" for="e-unote">Note beside the total (optional)<input id="e-unote" value="${esc(it.unitsNote)}" placeholder="e.g. Across 2 blocks"></label></div>`}
    <div class="grid2"><span class="mono">Photos · the first one is the cover</span><div class="photos" id="phs"></div></div>
    <div class="foot"><button class="btn danger" type="button" id="e-del">Remove ${isNow?'update':'project'}</button><button class="btn solid" type="submit">Done</button></div>
  </form>`;
  const sync=()=>{
    it.company=$('#e-co').value;it.status=$('#e-st').value;it.location=$('#e-loc').value.trim();
    if(isNow){it.title=$('#e-name').value.trim();it.text=$('#e-txt').value.trim();}
    else{it.name=$('#e-name').value.trim();it.description=$('#e-txt').value.trim();it.year=$('#e-yr').value.trim();
      const cat=$('#e-cat').value;if(it.company==='c'&&cat)it.category=cat;else delete it.category;
      if($('#e-home').checked)it.home=true;else delete it.home;
      const un=$('#e-unote').value.trim();if(un)it.unitsNote=un;else delete it.unitsNote;}
    setDirty(true);
  };
  $('#ed').addEventListener('input',sync);$('#ed').addEventListener('change',sync);
  if(!isNow)$('#e-co').addEventListener('change',()=>{$('#catWrap').hidden=$('#e-co').value!=='c';});
  if(isNow)$('#e-from').onchange=e=>{const p=doc.projects[+e.target.value];if(!p)return;
    it.company=p.company;it.status=p.status;it.title=p.name;it.location=p.location;it.text=p.description;it.photos=(p.photos||[]).slice();setDirty(true);renderEditor(v);toast('Copied from '+p.name+'. Edit the text to say what is happening now.');};
  const back=()=>{const bad=isNow?!it.title:!it.name;if(bad&&editing.isNew){arr.splice(editing.i,1);}editing=null;render();};
  $('#back').onclick=back;
  $('#ed').addEventListener('submit',e=>{e.preventDefault();sync();if(isNow?!it.title:!it.name){toast('Add a '+(isNow?'title':'project name')+' first.',true);$('#e-name').focus();return;}
    if(isNow&&!(it.photos||[]).length){toast('Add at least one photo so the update can show on the home page.',true);return;}
    editing=null;render();toast('Saved in the dashboard. Press Publish changes to update the website.');});
  $('#e-del').onclick=e=>{if(!confirmInline(e.currentTarget,'Tap to confirm'))return;arr.splice(editing.i,1);editing=null;setDirty(true);render();toast('Removed. Publish to update the website.');};
  if(!isNow)drawUnits(it);
  drawPhotos(it);
}
function drawUnits(it){
  it.units=it.units||[];const box=$('#units');
  const opt=sel=>Object.entries(UTYPES).map(([k,n])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(n)}</option>`).join('');
  box.innerHTML=`<div class="urows">${it.units.map((u,i)=>`<div class="urow">
     <label class="f">Type<select data-u="${i}" data-k="type">${opt(u.type)}</select></label>
     <label class="f">How many<input type="number" min="1" inputmode="numeric" data-u="${i}" data-k="count" value="${esc(u.count)}"></label>
     <label class="f">Bedrooms<input type="number" min="0" inputmode="numeric" data-u="${i}" data-k="beds" value="${esc(u.beds||'')}" placeholder="—"></label>
     <button type="button" class="btn sm danger" data-urm="${i}" aria-label="Remove this unit type">✕</button></div>`).join('')}</div>
     <button type="button" class="btn sm" id="uadd">+ Add unit type</button>`;
  const tot=()=>{const t=it.units.reduce((a,u)=>a+(+u.count||0),0);$('#utot').textContent=t?`Total: ${t} unit${t>1?'s':''}`:'No units yet';};
  box.querySelectorAll('[data-u]').forEach(el=>el.addEventListener('input',e=>{e.stopPropagation();const u=it.units[+el.dataset.u],k=el.dataset.k;u[k]=k==='type'?el.value:(el.value===''?0:Math.max(0,parseInt(el.value,10)||0));tot();setDirty(true);}));
  box.querySelectorAll('select[data-u]').forEach(el=>el.addEventListener('change',e=>{e.stopPropagation();it.units[+el.dataset.u].type=el.value;setDirty(true);}));
  box.querySelectorAll('[data-urm]').forEach(b=>b.onclick=()=>{it.units.splice(+b.dataset.urm,1);setDirty(true);drawUnits(it);});
  $('#uadd').onclick=()=>{it.units.push({type:'flat',count:1,beds:3});setDirty(true);drawUnits(it);};
  tot();
}
function drawPhotos(it){
  it.photos=it.photos||[];const box=$('#phs');
  box.innerHTML=it.photos.map((u,i)=>`<div class="ph"><img src="${esc(src(u))}" alt="Photo ${i+1}">${i===0?'<span class="cover">Cover</span>':''}<div class="pa">${i?`<button type="button" data-cov="${i}" aria-label="Make cover" title="Make cover">★</button><button type="button" data-l="${i}" aria-label="Move left">←</button>`:''}<button type="button" data-rm="${i}" aria-label="Remove photo">✕</button></div></div>`).join('')
   +`<label class="addph">+ Add photos<br>from phone or computer<input type="file" accept="image/*" multiple id="file"></label>`;
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{it.photos.splice(+b.dataset.rm,1);setDirty(true);drawPhotos(it);});
  box.querySelectorAll('[data-cov]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cov;it.photos.unshift(...it.photos.splice(i,1));setDirty(true);drawPhotos(it);});
  box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;[it.photos[i-1],it.photos[i]]=[it.photos[i],it.photos[i-1]];setDirty(true);drawPhotos(it);});
  $('#file').onchange=async e=>{
    const files=[...e.target.files];if(!files.length)return;
    for(const f of files){
      const ph=document.createElement('div');ph.className='ph up';ph.textContent='Uploading…';box.insertBefore(ph,box.lastElementChild);
      try{const blob=await shrink(f);const r=await fetch('/api/photo',{method:'POST',headers:{'content-type':blob.type},body:blob});const j=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(j.error||'Upload failed.');it.photos.push(j.url);setDirty(true);}
      catch(err){toast(err.message,true);}
    }
    drawPhotos(it);
  };
}
/* Resize big phone photos before upload: max 1600px, JPEG */
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const M=1600,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('Could not read that photo.')),'image/jpeg',.82);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that photo. Try a JPEG or PNG.'));};img.src=url;});}

/* ---------- Contact ---------- */
function renderContact(v){
  const c=doc.contact,F=[['phone1','Main phone (also used for WhatsApp)','0911 122 2007'],['phone2','Second phone','0911 133 3007'],['email1','General email','info@urielngr.com'],['email2','Enquiries email','enquiries@urielngr.com'],['address','Office address','2B Niyi Okunubi Street, Lekki Phase 1, Lagos'],['offices','Offices line','Offices in Lagos and Abuja.']];
  v.innerHTML=`<div class="head"><div><h2>Contact details</h2><p>Shown on the contact page and in the footer. The main phone is where WhatsApp messages from the website go.</p></div></div>
  <form class="editor" id="cf">${F.map(([k,l,ph])=>`<label class="f" for="c-${k}">${l}<input id="c-${k}" value="${esc(c[k])}" placeholder="${esc(ph)}"></label>`).join('')}</form>`;
  $('#cf').addEventListener('input',()=>{F.forEach(([k])=>c[k]=$('#c-'+k).value.trim());setDirty(true);});
}
/* ---------- Page text ---------- */
function renderText(v){
  const t=doc.text;
  v.innerHTML=`<div class="head"><div><h2>Page text</h2><p>The introduction under each company's headline. Keep it to two or three sentences.</p></div></div>
  <form class="editor" id="tf">${Object.entries(TEXT).map(([k,n])=>`<label class="f" for="t-${k}">${esc(n)}<textarea id="t-${k}">${esc(t[k])}</textarea></label>`).join('')}</form>`;
  $('#tf').addEventListener('input',()=>{Object.keys(TEXT).forEach(k=>t[k]=$('#t-'+k).value.trim());setDirty(true);});
}

start();
</script>
